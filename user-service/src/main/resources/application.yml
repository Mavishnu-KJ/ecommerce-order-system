server:
  port: 8081

spring:
  application:
    name: user-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver   # ← Added this line

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect   # ← Added this

  redis:
    host: localhost
    port: 6379

jwt:
  secret: ECommerceOrderSystemStrongSecretKeyAtLeast64CharsLongAndRandomWithoutUnderScore
  expiration: 86400000

logging:
  level:
    com.mavishnu.ecommerce: DEBUG